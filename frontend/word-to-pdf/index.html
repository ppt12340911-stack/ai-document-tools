<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word 轉 PDF | AI 文件工具平台</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← 返回工具平台</a>
        <h1>PDF <span>處理工坊</span></h1>
        <p class="page-subtitle">提供 Word 轉 PDF 與 PDF 權限密碼解鎖等服務</p>

        <!-- Tabs -->
        <div class="tabs-container">
            <button class="tab-btn active" id="tabWordBtn">🪄 Word 轉 PDF</button>
            <button class="tab-btn" id="tabUnlockBtn">🔓 PDF 權限解鎖</button>
            <button class="tab-btn" id="tabImageBtn">🖼️ PDF 轉圖片</button>
        </div>

        <!-- Word 轉 PDF 區塊 -->
        <div id="wordSection" class="tab-content active">
            <!-- 上傳區域 -->
            <div class="upload-section" id="dropZone">
                <div class="upload-icon">📄</div>
                <p class="upload-main-text">點擊或拖放 Word 檔案至此</p>
                <p class="upload-hint">支持 .docx 和 .doc 格式，可一次上傳多個檔案</p>
                <input type="file" id="fileInput" multiple accept=".docx,.doc" style="display: none;">
            </div>

            <!-- 檔案清單 -->
            <div class="file-list" id="fileList"></div>

            <!-- 操作按鈕 -->
            <div class="action-bar">
                <button class="btn btn-primary" id="convertBtn" disabled>
                    <span class="btn-icon">⚡</span> 開始轉換
                </button>
                <button class="btn btn-secondary" id="clearBtn" style="display:none;">
                    <span class="btn-icon">🗑️</span> 清除全部
                </button>
            </div>

            <!-- 進度區 -->
            <div class="progress-section" id="progressSection" style="display:none;">
                <div class="progress-header">
                    <span class="progress-title">轉換進度</span>
                    <span class="progress-count" id="progressCount">0/0</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-status" id="progressStatus">準備中...</div>
            </div>

            <!-- 轉換結果 -->
            <div class="results-section" id="resultsSection" style="display:none;">
                <div class="results-header">
                    <h2>✅ 轉換完成</h2>
                    <button class="btn btn-download-all" id="downloadAllBtn">
                        <span class="btn-icon">📦</span> 一鍵下載全部 (ZIP)
                    </button>
                </div>
                <div class="results-list" id="resultsList"></div>
            </div>
            
        </div>

        <!-- PDF 解鎖區塊 -->
        <div id="unlockSection" class="tab-content">
            <div class="upload-section upload-unlock" id="unlockDropZone">
                <div class="upload-icon">🔒</div>
                <p class="upload-main-text">點擊或拖放需解鎖的 PDF</p>
                <p class="upload-hint">支援批次處理多個 PDF 檔案 (移除複製、列印等限制)</p>
                <input type="file" id="unlockFileInput" multiple accept=".pdf" style="display: none;">
            </div>

            <div class="file-list" id="unlockFileList"></div>

            <div class="action-bar">
                <button class="btn btn-primary" id="unlockBtn" disabled style="background: linear-gradient(135deg, #00b894, #00cec9);">
                    <span class="btn-icon">🔓</span> 立即解鎖
                </button>
            </div>

            <div class="progress-section" id="unlockProgressSection" style="display:none;">
                <div class="progress-status" id="unlockProgressStatus" style="text-align: center; font-size: 1rem; color: #00e676;">正在解鎖中...</div>
            </div>
        </div>

        <!-- PDF 轉圖片區塊 -->
        <div id="imageSection" class="tab-content">
            <div class="upload-section upload-image" id="imageDropZone">
                <div class="upload-icon">🖼️</div>
                <p class="upload-main-text">點擊或拖放 PDF 轉換為圖片</p>
                <p class="upload-hint">支援高品質無損轉換，可選 PNG/JPG 與 DPI 解析度</p>
                <input type="file" id="imageFileInput" accept=".pdf" style="display: none;">
            </div>

            <div class="file-list" id="imageFileList"></div>

            <!-- 轉換設定 -->
            <div class="options-bar" id="imageOptions" style="display: none;">
                <div class="option-group">
                    <label>輸出格式</label>
                    <select id="imageFormat">
                        <option value="png">PNG (無損壓縮)</option>
                        <option value="jpeg">JPG (高品質)</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>解析度 (DPI)</label>
                    <select id="imageDpi">
                        <option value="150">150 DPI (標準)</option>
                        <option value="300" selected>300 DPI (印刷級/無損)</option>
                        <option value="600">600 DPI (極致清晰)</option>
                    </select>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" id="imageConvertBtn" disabled style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <span class="btn-icon">⚡</span> 立即轉換
                </button>
            </div>

            <div class="progress-section" id="imageProgressSection" style="display:none;">
                <div class="progress-status" id="imageProgressStatus" style="text-align: center; font-size: 1rem; color: #f093fb;">正在進行高品質轉換，請稍候...</div>
            </div>
        </div>
    </div>

    <script src="../site-config.js"></script>
    <script src="script.js?v=20260409"></script>
</body>
</html>
