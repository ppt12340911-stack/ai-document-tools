name: Build ClipMerge Studio APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare project
        run: |
          rm -rf .chatgpt-build/clipmerge
          mkdir -p .chatgpt-build/clipmerge
          unzip -q .chatgpt-build/clipmerge_project.zip -d .chatgpt-build/clipmerge

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-APK
          path: out/ClipMergeStudio.apk
          if-no-files-found: error
          retention-days: 1
