name: Build ClipMerge Studio v3.1 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v3.1 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/clipmerge_v28.b64
          base64 -d /tmp/clipmerge_v28.b64 > /tmp/clipmerge_v28.zip
          rm -rf .chatgpt-build/clipmerge-v31-src
          mkdir -p .chatgpt-build/clipmerge-v31-src
          unzip -q -o /tmp/clipmerge_v28.zip -d .chatgpt-build/clipmerge-v31-src

          echo ''' | base64 -d | gzip -d > .chatgpt-build/clipmerge-v31-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.chatgpt-build/clipmerge-v31-src')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          pattern = r'\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?(?:</activity>|/>)'
          replacement = '<activity android:name=".DancePracticeActivity" android:configChanges="keyboardHidden|orientation|screenSize" android:screenOrientation="landscape" android:launchMode="singleTop" android:exported="true" android:label="YouTube 練舞" android:theme="@android:style/Theme.Material.Light.NoActionBar"><intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/plain" /></intent-filter></activity>'
          m2, n = re.subn(pattern, '\n        ' + replacement, m, count=1)
          if n != 1:
              raise SystemExit('DancePracticeActivity manifest block not found')
          manifest.write_text(m2, encoding='utf-8')
          mp = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          ms = mp.read_text(encoding='utf-8')
          ms = ms.replace('ClipMerge 爆笑剪片工坊  v2.8', 'ClipMerge 爆笑剪片工坊  v3.1')
          mp.write_text(ms, encoding='utf-8')
          PY

          cat > .chatgpt-build/clipmerge-v31-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v31-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 11
                  versionName = "3.1"
              }

              buildFeatures { buildConfig = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v31-src/gradle.properties
          grep -q '⛶ 全螢幕' .chatgpt-build/clipmerge-v31-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'autoFullscreenCheck' .chatgpt-build/clipmerge-v31-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'android:mimeType="text/plain"' .chatgpt-build/clipmerge-v31-src/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v31-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v31-src/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio-v3.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-v3.1-APK
          path: out/ClipMergeStudio-v3.1.apk
          if-no-files-found: error
          retention-days: 1
