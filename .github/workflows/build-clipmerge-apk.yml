name: Build ClipMerge Studio v3.3 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v3.3 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/clipmerge_v28.b64
          base64 -d /tmp/clipmerge_v28.b64 > /tmp/clipmerge_v28.zip
          unzip -t /tmp/clipmerge_v28.zip

          rm -rf .chatgpt-build/clipmerge-v33-src
          mkdir -p .chatgpt-build/clipmerge-v33-src
          unzip -q -o /tmp/clipmerge_v28.zip -d .chatgpt-build/clipmerge-v33-src

          cat .chatgpt-build/clipmerge/v31/dance_part0.txt \
              .chatgpt-build/clipmerge/v31/dance_part1.txt \
              .chatgpt-build/clipmerge/v31/dance_part2.txt \
              .chatgpt-build/clipmerge/v31/dance_part3.txt > /tmp/dance_v31.b64
          test "$(wc -c < /tmp/dance_v31.b64)" -eq 11928
          base64 -d /tmp/dance_v31.b64 | gzip -d > .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.chatgpt-build/clipmerge-v33-src')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          replacement = '''
                  <activity
                      android:name=".DancePracticeActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTop"
                      android:exported="true"
                      android:label="YouTube 練舞"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>'''
          m2, n = re.subn(
              r'\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?(?:</activity>|/>)',
              replacement,
              m,
              count=1,
          )
          if n != 1:
              raise SystemExit('DancePracticeActivity manifest block not found')
          manifest.write_text(m2, encoding='utf-8')

          dance = root / 'app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt'
          s = dance.read_text(encoding='utf-8')

          # Keep the v3.2 YouTube embed fix, whether already present or not.
          old_base = 'webView.loadDataWithBaseURL("https://www.youtube.com", html, "text/html", "UTF-8", null)'
          if old_base in s:
              s = s.replace(
                  old_base,
                  'webView.loadDataWithBaseURL("https://com.clipmerge.studio/", html, "text/html", "UTF-8", null)',
                  1,
              )
          if 'https://com.clipmerge.studio/' not in s:
              raise SystemExit('YouTube WebView origin/base URL missing')

          if "origin:'https://com.clipmerge.studio'" not in s:
              s, count = re.subn(
                  r'(playerVars\s*:\s*\{)',
                  r"\1origin:'https://com.clipmerge.studio',",
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('YouTube player origin patch failed')

          # Add the scrolling containers as fields.
          old_fields = '''    private lateinit var leftPanel: LinearLayout
          private lateinit var rightPanel: LinearLayout
          '''
          new_fields = '''    private lateinit var leftPanel: LinearLayout
          private lateinit var leftControlsScroll: ScrollView
          private lateinit var leftControlsPanel: LinearLayout
          private lateinit var rightScroll: ScrollView
          private lateinit var rightPanel: LinearLayout
          '''
          if 'private lateinit var leftControlsScroll: ScrollView' not in s:
              if old_fields not in s:
                  raise SystemExit('left/right field block not found')
              s = s.replace(old_fields, new_fields, 1)

          old_layout = '''        leftPanel = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(0, 0, dp(8), 0)
          }
          rightPanel = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(8), 0, 0, 0)
          }
          mainLayout.addView(leftPanel, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.42f))
          mainLayout.addView(rightPanel, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f))
          '''
          new_layout = '''        leftPanel = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(0, 0, dp(8), 0)
          }

          leftControlsScroll = ScrollView(this).apply {
              isFillViewport = false
              overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
          }
          leftControlsPanel = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(0, 0, 0, dp(24))
          }
          leftControlsScroll.addView(
              leftControlsPanel,
              ScrollView.LayoutParams(
                  ScrollView.LayoutParams.MATCH_PARENT,
                  ScrollView.LayoutParams.WRAP_CONTENT
              )
          )

          rightScroll = ScrollView(this).apply {
              isFillViewport = true
              overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
          }
          rightPanel = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(8), 0, 0, dp(28))
          }
          rightScroll.addView(
              rightPanel,
              ScrollView.LayoutParams(
                  ScrollView.LayoutParams.MATCH_PARENT,
                  ScrollView.LayoutParams.WRAP_CONTENT
              )
          )

          mainLayout.addView(leftPanel, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.42f))
          mainLayout.addView(rightScroll, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f))
          '''
          if 'rightScroll = ScrollView(this)' not in s:
              if old_layout not in s:
                  raise SystemExit('main left/right layout block not found')
              s = s.replace(old_layout, new_layout, 1)

          old_controls_anchor = '        leftPanel.addView(fullscreenControls, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(62)))\n\n        timeRow = LinearLayout(this).apply {'
          new_controls_anchor = '''        leftPanel.addView(fullscreenControls, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(62)))
          leftPanel.addView(leftControlsScroll, LinearLayout.LayoutParams(
              LinearLayout.LayoutParams.MATCH_PARENT,
              0,
              1f
          ))

          timeRow = LinearLayout(this).apply {'''
          if 'leftPanel.addView(leftControlsScroll' not in s:
              if old_controls_anchor not in s:
                  raise SystemExit('left controls anchor not found')
              s = s.replace(old_controls_anchor, new_controls_anchor, 1)

          for name in ('timeRow', 'setRow', 'speedRow', 'addRow'):
              s = s.replace(f'        leftPanel.addView({name})', f'        leftControlsPanel.addView({name})', 1)

          old_list = '        rightPanel.addView(segmentList, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))'
          if old_list in s:
              s = s.replace(
                  old_list,
                  '        rightPanel.addView(segmentList, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(210)))',
                  1,
              )

          s = s.replace('        rightPanel.visibility = View.GONE\n', '        rightScroll.visibility = View.GONE\n', 1)
          s = s.replace('        rightPanel.visibility = View.VISIBLE\n', '        rightScroll.visibility = View.VISIBLE\n', 1)

          old_hide = '''        timeRow.visibility = View.GONE
          setRow.visibility = View.GONE
          speedRow.visibility = View.GONE
          addRow.visibility = View.GONE
          '''
          if old_hide in s:
              s = s.replace(old_hide, '        leftControlsScroll.visibility = View.GONE\n', 1)

          old_show = '''        timeRow.visibility = View.VISIBLE
          setRow.visibility = View.VISIBLE
          speedRow.visibility = View.VISIBLE
          addRow.visibility = View.VISIBLE
          '''
          if old_show in s:
              s = s.replace(old_show, '        leftControlsScroll.visibility = View.VISIBLE\n', 1)

          s = s.replace('text = "💃 YouTube 練舞剪輯 v3.2"', 'text = "💃 YouTube 練舞剪輯 v3.3"', 1)
          s = s.replace('text = "💃 YouTube 練舞剪輯 v3.1"', 'text = "💃 YouTube 練舞剪輯 v3.3"', 1)
          s = s.replace(
              'text = "最快方式：YouTube 影片或播放清單 → 分享 → YouTube 練舞。練習時可按「⛶ 全螢幕」。"',
              'text = "最快方式：YouTube 影片或播放清單 → 分享 → YouTube 練舞。左右操作區可上下滑動；練習時可按「⛶ 全螢幕」。"',
              1,
          )

          if 'leftControlsScroll' not in s or 'rightScroll' not in s:
              raise SystemExit('scroll containers were not applied')
          dance.write_text(s, encoding='utf-8')

          main = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          ms = main.read_text(encoding='utf-8')
          ms = re.sub(r'ClipMerge 爆笑剪片工坊\s+v\d+\.\d+', 'ClipMerge 爆笑剪片工坊  v3.3', ms)
          main.write_text(ms, encoding='utf-8')
          PY

          cat > .chatgpt-build/clipmerge-v33-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v33-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 13
                  versionName = "3.3"
              }

              buildFeatures { buildConfig = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v33-src/gradle.properties
          grep -q 'https://com.clipmerge.studio/' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'leftControlsScroll = ScrollView' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'rightScroll = ScrollView' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'YouTube 練舞剪輯 v3.3' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v33-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v33-src/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio-v3.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-v3.3-APK
          path: out/ClipMergeStudio-v3.3.apk
          if-no-files-found: error
          retention-days: 1
