name: Build ClipMerge Studio v2.9 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v2.9 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/clipmerge_v28.b64
          test "$(wc -c < /tmp/clipmerge_v28.b64)" -eq 46232
          base64 -d /tmp/clipmerge_v28.b64 > /tmp/clipmerge_v28.zip
          unzip -t /tmp/clipmerge_v28.zip
          rm -rf .chatgpt-build/clipmerge-v29-src
          mkdir -p .chatgpt-build/clipmerge-v29-src
          unzip -q -o /tmp/clipmerge_v28.zip -d .chatgpt-build/clipmerge-v29-src

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.chatgpt-build/clipmerge-v29-src')

          # Make DancePracticeActivity an Android Share target for text/plain.
          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          new_activity = '''        <activity
                      android:name=".DancePracticeActivity"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTop"
                      android:exported="true"
                      android:label="YouTube 練舞"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>'''
          m2, n = re.subn(
              r'\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?</activity>|\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?/>',
              '\n' + new_activity,
              m,
              count=1
          )
          if n != 1:
              raise SystemExit('DancePracticeActivity manifest block not found')
          manifest.write_text(m2, encoding='utf-8')

          p = root / 'app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt'
          s = p.read_text(encoding='utf-8')

          if 'import android.content.Intent' not in s:
              s = s.replace(
                  'import android.content.Context\n',
                  'import android.content.Context\nimport android.content.Intent\nimport android.content.ClipboardManager\n'
              )

          if 'private var playerReady = false' not in s:
              s = s.replace(
                  '    private var playbackToken = 0\n',
                  '    private var playbackToken = 0\n    private var playerReady = false\n'
              )

          if 'handleIncomingShare(intent)' not in s:
              s = s.replace(
                  '        loadPlayerHtml()\n',
                  '        loadPlayerHtml()\n        handleIncomingShare(intent)\n'
              )

          # Shrink URL field a little, then append quick buttons after the existing Load button.
          lines = s.splitlines()
          found_url = False
          for i, line in enumerate(lines):
              if 'top.addView(urlInput' in line:
                  lines[i] = re.sub(r'dp\(\d+\)', 'dp(245)', line, count=1)
                  found_url = True
                  break
          if not found_url:
              raise SystemExit('urlInput row not found')

          found_load = False
          for i, line in enumerate(lines):
              if '載入影片' in line and 'loadFromUrl' in line and 'top.addView' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  extra = [
                      indent + 'top.addView(space(dp(6)))',
                      indent + 'top.addView(funButton("📋 貼上", Color.rgb(34,197,94)) { pasteFromClipboard() }, LinearLayout.LayoutParams(dp(92), dp(48)))',
                      indent + 'top.addView(space(dp(6)))',
                      indent + 'top.addView(funButton("開 YouTube", Color.rgb(139,92,246)) { openYouTube() }, LinearLayout.LayoutParams(dp(112), dp(48)))',
                  ]
                  lines[i+1:i+1] = extra
                  found_load = True
                  break
          if not found_load:
              raise SystemExit('Load-video button line not found')
          s = '\n'.join(lines) + '\n'

          s = s.replace(
              'text = "不用下載：直接記錄 YouTube 影片的開始/結束時間。可慢速、循環、排序連播；不會輸出成新的 MP4。"',
              'text = "最快方式：在 YouTube 影片按『分享』→ 選『YouTube 練舞』，影片會自動載入。也可以複製連結後按『📋 貼上』。"'
          )

          # IFrame player readiness callback, so a shared URL can be received before the player finishes loading.
          s = s.replace(
              'events:{onStateChange:onStateChange}',
              'events:{onReady:onReady,onStateChange:onStateChange}'
          )
          if 'function onReady(e){ Android.playerReady(); }' not in s:
              pos = s.find('function onStateChange(e){')
              if pos == -1:
                  raise SystemExit('onStateChange JS function not found')
              s = s[:pos] + 'function onReady(e){ Android.playerReady(); }\n              ' + s[pos:]

          # Replace manual-only URL loading with shared-link / clipboard-aware loading.
          start = s.find('    private fun loadFromUrl() {')
          end = s.find('    private fun extractVideoId', start)
          if start == -1 or end == -1:
              raise SystemExit('loadFromUrl/extractVideoId block not found')
          new_block = '''    private fun loadFromUrl() {
                  prepareVideo(urlInput.text.toString())
              }

              private fun prepareVideo(raw: String) {
                  val id = extractVideoId(raw)
                  if (id == null) { toast("無法辨識 YouTube 網址"); return }
                  currentVideoId = id
                  startSec = 0.0
                  endSec = 15.0
                  updateTimes()
                  if (playerReady) {
                      webView.evaluateJavascript("loadVideo('$id')", null)
                      status("影片已載入，播放到想練的位置後按『設目前為起點／終點』")
                  } else {
                      status("正在準備 YouTube 播放器…")
                  }
              }

              private fun pasteFromClipboard() {
                  val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cb.primaryClip
                  val t = if (clip != null && clip.itemCount > 0) {
                      clip.getItemAt(0).coerceToText(this).toString()
                  } else ""
                  if (t.isBlank()) { toast("剪貼簿沒有 YouTube 網址"); return }
                  urlInput.setText(t)
                  prepareVideo(t)
              }

              private fun openYouTube() {
                  val uri = android.net.Uri.parse("https://www.youtube.com/")
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, uri).apply {
                          setPackage("com.google.android.youtube")
                      })
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, uri))
                      } catch (_: Exception) {
                          toast("無法開啟 YouTube")
                      }
                  }
              }

              private fun handleIncomingShare(incoming: Intent?) {
                  if (incoming?.action != Intent.ACTION_SEND) return
                  val shared = incoming.getStringExtra(Intent.EXTRA_TEXT)
                      ?: incoming.getCharSequenceExtra(Intent.EXTRA_TEXT)?.toString()
                  if (!shared.isNullOrBlank()) {
                      urlInput.setText(shared)
                      prepareVideo(shared)
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleIncomingShare(intent)
              }

          '''
          s = s[:start] + new_block + s[end:]

          if '@JavascriptInterface fun playerReady()' not in s:
              bridge = '    inner class PlayerBridge {\n'
              idx = s.find(bridge)
              if idx == -1:
                  raise SystemExit('PlayerBridge not found')
              inject = '''    inner class PlayerBridge {
                  @JavascriptInterface fun playerReady() {
                      runOnUiThread {
                          this@DancePracticeActivity.playerReady = true
                          currentVideoId?.let { id ->
                              webView.evaluateJavascript("loadVideo('$id')", null)
                              status("影片已載入，播放到想練的位置後按『設目前為起點／終點』")
                          }
                      }
                  }

          '''
              s = s[:idx] + inject + s[idx + len(bridge):]

          p.write_text(s, encoding='utf-8')

          mp = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          ms = mp.read_text(encoding='utf-8').replace(
              'ClipMerge 爆笑剪片工坊  v2.8',
              'ClipMerge 爆笑剪片工坊  v2.9'
          )
          mp.write_text(ms, encoding='utf-8')
          PY

          cat > .chatgpt-build/clipmerge-v29-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v29-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 10
                  versionName = "2.9"
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v29-src/gradle.properties
          grep -q '📋 貼上' .chatgpt-build/clipmerge-v29-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'handleIncomingShare' .chatgpt-build/clipmerge-v29-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'android:mimeType="text/plain"' .chatgpt-build/clipmerge-v29-src/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v29-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v29-src/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio-v2.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-v2.9-APK
          path: out/ClipMergeStudio-v2.9.apk
          if-no-files-found: error
          retention-days: 1
