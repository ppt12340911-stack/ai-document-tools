name: Build ClipMerge Studio v2.8 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v2.8 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/clipmerge_v28.b64
          test "$(wc -c < /tmp/clipmerge_v28.b64)" -eq 46232
          base64 -d /tmp/clipmerge_v28.b64 > /tmp/clipmerge_v28.zip
          unzip -t /tmp/clipmerge_v28.zip
          rm -rf .chatgpt-build/clipmerge-v28-src
          mkdir -p .chatgpt-build/clipmerge-v28-src
          unzip -q -o /tmp/clipmerge_v28.zip -d .chatgpt-build/clipmerge-v28-src

          cat > .chatgpt-build/clipmerge-v28-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v28-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 9
                  versionName = "2.8"
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v28-src/gradle.properties
          test -f .chatgpt-build/clipmerge-v28-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt
          test -f .chatgpt-build/clipmerge-v28-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          test -f .chatgpt-build/clipmerge-v28-src/app/src/main/java/com/clipmerge/studio/SplashActivity.kt

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v28-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v28-src/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio-v2.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-v2.8-APK
          path: out/ClipMergeStudio-v2.8.apk
          if-no-files-found: error
          retention-days: 1
