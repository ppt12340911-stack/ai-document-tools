name: Build ClipMerge Studio v3.3 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v3.3 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/clipmerge_v28.b64
          base64 -d /tmp/clipmerge_v28.b64 > /tmp/clipmerge_v28.zip
          unzip -t /tmp/clipmerge_v28.zip

          rm -rf .chatgpt-build/clipmerge-v33-src
          mkdir -p .chatgpt-build/clipmerge-v33-src
          unzip -q -o /tmp/clipmerge_v28.zip -d .chatgpt-build/clipmerge-v33-src

          cat .chatgpt-build/clipmerge/v31/dance_part0.txt \
              .chatgpt-build/clipmerge/v31/dance_part1.txt \
              .chatgpt-build/clipmerge/v31/dance_part2.txt \
              .chatgpt-build/clipmerge/v31/dance_part3.txt > /tmp/dance_v31.b64
          test "$(wc -c < /tmp/dance_v31.b64)" -eq 11928
          base64 -d /tmp/dance_v31.b64 | gzip -d > .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.chatgpt-build/clipmerge-v33-src')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          replacement = '''
                  <activity
                      android:name=".DancePracticeActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTop"
                      android:exported="true"
                      android:label="YouTube 練舞"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>'''
          m2, n = re.subn(
              r'\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?(?:</activity>|/>)',
              replacement,
              m,
              count=1,
          )
          if n != 1:
              raise SystemExit('DancePracticeActivity manifest block not found')
          manifest.write_text(m2, encoding='utf-8')

          dance = root / 'app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt'
          s = dance.read_text(encoding='utf-8')

          # Preserve the v3.2 YouTube WebView embed fix.
          s, base_count = re.subn(
              r'webView\.loadDataWithBaseURL\(\s*"https://www\.youtube\.com"',
              'webView.loadDataWithBaseURL("https://com.clipmerge.studio/"',
              s,
              count=1,
          )
          if base_count != 1:
              raise SystemExit('YouTube WebView base URL patch did not match')
          if "origin:'https://com.clipmerge.studio'" not in s:
              s, origin_count = re.subn(
                  r'(playerVars\s*:\s*\{)',
                  r"\1origin:'https://com.clipmerge.studio',",
                  s,
                  count=1,
              )
              if origin_count != 1:
                  raise SystemExit('YouTube playerVars origin patch did not match')

          # v3.3: make left and right panels independently vertically scrollable.
          new_cols = '''        val leftScroll = ScrollView(this).apply {
              isFillViewport = true
              overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
          }
          val rightScroll = ScrollView(this).apply {
              isFillViewport = true
              overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
          }
          val left = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(0, 0, dp(8), dp(24))
          }
          val right = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(8), 0, 0, dp(24))
          }
          leftScroll.addView(left, FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.MATCH_PARENT,
              FrameLayout.LayoutParams.WRAP_CONTENT
          ))
          rightScroll.addView(right, FrameLayout.LayoutParams(
              FrameLayout.LayoutParams.MATCH_PARENT,
              FrameLayout.LayoutParams.WRAP_CONTENT
          ))
          main.addView(leftScroll, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1.42f))
          main.addView(rightScroll, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f))'''

          s, cols_count = re.subn(
              r'\s*val left = LinearLayout\(this\)\.apply \{[\s\S]*?main\.addView\(right,\s*LinearLayout\.LayoutParams\(0,\s*LinearLayout\.LayoutParams\.MATCH_PARENT,\s*1f\)\)',
              '\n' + new_cols,
              s,
              count=1,
          )
          if cols_count != 1:
              raise SystemExit('column block not found for scroll patch')

          s, list_count = re.subn(
              r'right\.addView\(segmentList,\s*LinearLayout\.LayoutParams\(\s*LinearLayout\.LayoutParams\.MATCH_PARENT,\s*0,\s*1f\s*\)\)',
              'right.addView(segmentList, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(210)))',
              s,
              count=1,
          )
          if list_count != 1:
              raise SystemExit('segment list layout block not found')

          s = s.replace('💃 YouTube 練舞剪輯 v3.1', '💃 YouTube 練舞剪輯 v3.3')
          dance.write_text(s, encoding='utf-8')

          main = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          ms = main.read_text(encoding='utf-8')
          ms = ms.replace('ClipMerge 爆笑剪片工坊  v2.8', 'ClipMerge 爆笑剪片工坊  v3.3')
          main.write_text(ms, encoding='utf-8')
          PY

          cat > .chatgpt-build/clipmerge-v33-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v33-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 13
                  versionName = "3.3"
              }

              buildFeatures { buildConfig = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v33-src/gradle.properties
          grep -q 'https://com.clipmerge.studio/' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'val leftScroll = ScrollView' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'val rightScroll = ScrollView' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          grep -q 'dp(210)' .chatgpt-build/clipmerge-v33-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v33-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v33-src/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio-v3.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-v3.3-APK
          path: out/ClipMergeStudio-v3.3.apk
          if-no-files-found: error
          retention-days: 1
