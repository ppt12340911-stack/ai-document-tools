name: Build ClipMerge Studio APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v2.5 project
        run: |
          cat .chatgpt-build/clipmerge/v23_parts/part0.txt \
              .chatgpt-build/clipmerge/v23_parts/part1.txt \
              .chatgpt-build/clipmerge/v23_parts/part2.txt \
              .chatgpt-build/clipmerge/v23_parts/part3.txt \
              .chatgpt-build/clipmerge/v23_parts/part4.txt > /tmp/clipmerge_project.b64
          test "$(wc -c < /tmp/clipmerge_project.b64)" -eq 20796
          base64 -d /tmp/clipmerge_project.b64 > /tmp/clipmerge_project.zip
          unzip -t /tmp/clipmerge_project.zip
          rm -rf .chatgpt-build/clipmerge-src
          mkdir -p .chatgpt-build/clipmerge-src
          unzip -q -o /tmp/clipmerge_project.zip -d .chatgpt-build/clipmerge-src

          cat > .chatgpt-build/clipmerge-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 6
                  versionName = "2.5"
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          mkdir -p .chatgpt-build/clipmerge-src/app/src/main/res/drawable-nodpi
          cat > /tmp/clipmerge_icon.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/clipmerge_icon.b64 > .chatgpt-build/clipmerge-src/app/src/main/res/drawable-nodpi/ic_launcher_funny.webp

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.chatgpt-build/clipmerge-src')
          main = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          text = main.read_text(encoding='utf-8')

          if 'import android.content.res.ColorStateList' not in text:
              text = text.replace('import android.content.Context\n', 'import android.content.Context\nimport android.content.res.ColorStateList\n')

          reps = {
              'setImageResource(R.drawable.ic_launcher)': 'setImageResource(R.drawable.ic_launcher_funny)',
              'text = "ClipMerge Studio  v2.3"': 'text = "ClipMerge 爆笑剪片工坊  v2.5"',
              'top.addView(bigButton("＋ 加入影片") { pickVideos() })': 'top.addView(bigButton("🤣 加入影片") { pickVideos() })',
              'top.addView(bigButton("YouTube 連結") { showYouTubeDialog() })': 'top.addView(bigButton("📺 YouTube") { showYouTubeDialog() })',
              'youtubeQueueButton = bigButton("YT 清單 ${youtubeQueue.size}") { showYoutubeQueueDialog() }': 'youtubeQueueButton = bigButton("📦 YT 清單 ${youtubeQueue.size}") { showYoutubeQueueDialog() }',
              'exportButton = bigButton("輸出 MP4") { requestOutputLocation() }.apply {': 'exportButton = bigButton("🚀 輸出 MP4") { requestOutputLocation() }.apply {',
              'text = "↓ 畫面內容可上下滑動"': 'text = "↓ 往下滑，開始亂剪一通！"',
              'text = "選取片段：--"': 'text = "選取片段：準備開剪！"',
              'rangeRow.addView(bigButton("預覽片段") { previewCurrentRange() })': 'rangeRow.addView(bigButton("👀 預覽") { previewCurrentRange() })',
              'rangeRow.addView(bigButton("加入剪輯清單 →") { addCurrentRangeAsClip() })': 'rangeRow.addView(bigButton("✂️ 加進清單") { addCurrentRangeAsClip() })',
              'text = "剪輯清單 / 合併順序"': 'text = "爆笑剪輯清單 / 合併順序"',
              'editRow1.addView(bigButton("↑ 上移") { moveClip(-1) }, LinearLayout.LayoutParams(0, dp(52), 1f))': 'editRow1.addView(bigButton("⬆ 往上") { moveClip(-1) }, LinearLayout.LayoutParams(0, dp(52), 1f))',
              'editRow1.addView(bigButton("↓ 下移") { moveClip(1) }, LinearLayout.LayoutParams(0, dp(52), 1f))': 'editRow1.addView(bigButton("⬇ 往下") { moveClip(1) }, LinearLayout.LayoutParams(0, dp(52), 1f))',
              'editRow1.addView(bigButton("刪除") { removeSelectedClip() }, LinearLayout.LayoutParams(0, dp(52), 1f))': 'editRow1.addView(bigButton("🗑 刪掉") { removeSelectedClip() }, LinearLayout.LayoutParams(0, dp(52), 1f))',
              'editRow2.addView(bigButton("清空") { clearClips() }, LinearLayout.LayoutParams(0, dp(52), 1f))': 'editRow2.addView(bigButton("💥 清空") { clearClips() }, LinearLayout.LayoutParams(0, dp(52), 1f))',
              'editRow2.addView(bigButton("播放選取") {': 'editRow2.addView(bigButton("▶ 播放") {',
              'youtubeQueueButton.text = "YT 清單 ${youtubeQueue.size}"': 'youtubeQueueButton.text = "📦 YT 清單 ${youtubeQueue.size}"',
              'setStatus("請先加入影片")': 'setStatus("先丟幾支影片進來，我們開始爆笑剪片！")',
              'toast("已加入剪輯片段")': 'toast("已加入剪輯清單，笑點+1")',
          }
          for a, b in reps.items():
              text = text.replace(a, b)

          # Add a compact funny homepage hero card below the toolbar.
          marker = '        root.addView(top)\n\n        val scroll = ScrollView(this).apply {'
          if marker in text:
              hero = '''        root.addView(top)\n\n        val hero = LinearLayout(this).apply {\n            orientation = LinearLayout.HORIZONTAL\n            gravity = Gravity.CENTER_VERTICAL\n            setPadding(dp(18), dp(8), dp(18), dp(8))\n            setBackgroundColor(Color.rgb(88, 80, 236))\n        }\n        val heroIcon = ImageView(this).apply {\n            setImageResource(R.drawable.ic_launcher_funny)\n            scaleType = ImageView.ScaleType.CENTER_INSIDE\n        }\n        hero.addView(heroIcon, LinearLayout.LayoutParams(dp(84), dp(84)))\n        hero.addView(space(dp(14)))\n        val heroText = TextView(this).apply {\n            text = "剪一剪、拼一拼、笑著輸出！\\n今天要把哪幾段剪得超好笑？"\n            textSize = 18f\n            setTextColor(Color.WHITE)\n            typeface = android.graphics.Typeface.DEFAULT_BOLD\n            gravity = Gravity.CENTER_VERTICAL\n        }\n        hero.addView(heroText, LinearLayout.LayoutParams(0, dp(88), 1f))\n        root.addView(hero, LinearLayout.LayoutParams(\n            LinearLayout.LayoutParams.MATCH_PARENT, dp(96)\n        ))\n\n        val scroll = ScrollView(this).apply {'''
              text = text.replace(marker, hero)

          old = '''    private fun bigButton(text: String, onClick: () -> Unit): Button {\n        return Button(this).apply {\n            this.text = text\n            textSize = 16f\n            isAllCaps = false\n            minHeight = dp(48)\n            setOnClickListener { onClick() }\n        }\n    }\n'''
          new = '''    private fun bigButton(text: String, onClick: () -> Unit): Button {\n        val bgColor = when {\n            text.contains("YouTube") || text.contains("📺") -> Color.rgb(239, 68, 68)\n            text.contains("輸出") || text.contains("🚀") -> Color.rgb(249, 115, 22)\n            text.contains("YT 清單") || text.contains("📦") -> Color.rgb(139, 92, 246)\n            text.contains("清空") || text.contains("💥") -> Color.rgb(236, 72, 153)\n            text.contains("刪") || text.contains("🗑") -> Color.rgb(107, 114, 128)\n            text.contains("預覽") || text.contains("👀") || text.contains("播放") || text.contains("▶") -> Color.rgb(14, 165, 233)\n            text.contains("加入") || text.contains("✂️") || text.contains("加進") -> Color.rgb(34, 197, 94)\n            else -> Color.rgb(59, 130, 246)\n        }\n        return Button(this).apply {\n            this.text = text\n            textSize = 16f\n            isAllCaps = false\n            minHeight = dp(48)\n            backgroundTintList = ColorStateList.valueOf(bgColor)\n            setTextColor(Color.WHITE)\n            setPadding(dp(10), dp(6), dp(10), dp(6))\n            elevation = dp(2).toFloat()\n            setOnClickListener { onClick() }\n        }\n    }\n'''
          text = text.replace(old, new)
          main.write_text(text, encoding='utf-8')

          # Splash screen using the same mascot icon/style.
          splash = root / 'app/src/main/java/com/clipmerge/studio/SplashActivity.kt'
          splash.write_text('''package com.clipmerge.studio\n\nimport android.app.Activity\nimport android.content.Intent\nimport android.graphics.Color\nimport android.os.Bundle\nimport android.os.Handler\nimport android.os.Looper\nimport android.view.Gravity\nimport android.widget.ImageView\nimport android.widget.LinearLayout\nimport android.widget.TextView\n\nclass SplashActivity : Activity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.statusBarColor = Color.rgb(15, 23, 42)\n        window.navigationBarColor = Color.rgb(15, 23, 42)\n\n        val root = LinearLayout(this).apply {\n            orientation = LinearLayout.VERTICAL\n            gravity = Gravity.CENTER\n            setPadding(32, 24, 32, 24)\n            setBackgroundColor(Color.rgb(30, 115, 255))\n        }\n        val icon = ImageView(this).apply {\n            setImageResource(R.drawable.ic_launcher_funny)\n            adjustViewBounds = true\n            scaleType = ImageView.ScaleType.CENTER_INSIDE\n        }\n        root.addView(icon, LinearLayout.LayoutParams(360, 360))\n        val title = TextView(this).apply {\n            text = "ClipMerge 爆笑剪片工坊"\n            textSize = 30f\n            setTextColor(Color.WHITE)\n            gravity = Gravity.CENTER\n            typeface = android.graphics.Typeface.DEFAULT_BOLD\n        }\n        root.addView(title)\n        val sub = TextView(this).apply {\n            text = "剪一剪、拼一拼、笑著輸出！"\n            textSize = 18f\n            setTextColor(Color.WHITE)\n            gravity = Gravity.CENTER\n            setPadding(0, 12, 0, 0)\n        }\n        root.addView(sub)\n        setContentView(root)\n\n        Handler(Looper.getMainLooper()).postDelayed({\n            startActivity(Intent(this, MainActivity::class.java))\n            finish()\n        }, 1100L)\n    }\n}\n''', encoding='utf-8')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          m = m.replace('android:icon="@drawable/ic_launcher"', 'android:icon="@drawable/ic_launcher_funny"')
          m = m.replace('android:label="ClipMerge Studio"', 'android:label="ClipMerge 爆笑剪片工坊"\n        android:roundIcon="@drawable/ic_launcher_funny"')
          old_launcher = '''        <activity\n            android:name=".MainActivity"\n            android:configChanges="keyboardHidden|orientation|screenSize"\n            android:screenOrientation="landscape"\n            android:launchMode="singleTop"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n'''
          new_launcher = '''        <activity\n            android:name=".SplashActivity"\n            android:screenOrientation="landscape"\n            android:exported="true"\n            android:theme="@android:style/Theme.Material.Light.NoActionBar">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n\n        <activity\n            android:name=".MainActivity"\n            android:configChanges="keyboardHidden|orientation|screenSize"\n            android:screenOrientation="landscape"\n            android:launchMode="singleTop"\n            android:exported="true">\n'''
          m = m.replace(old_launcher, new_launcher)
          manifest.write_text(m, encoding='utf-8')

          (root / 'app/src/main/res/values/strings.xml').write_text('''<resources>\n    <string name="app_name">ClipMerge 爆笑剪片工坊</string>\n</resources>\n''', encoding='utf-8')
          PY

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-src/gradle.properties
          test -f .chatgpt-build/clipmerge-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt
          test -f .chatgpt-build/clipmerge-src/app/src/main/java/com/clipmerge/studio/SplashActivity.kt
          test -s .chatgpt-build/clipmerge-src/app/src/main/res/drawable-nodpi/ic_launcher_funny.webp

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-src/app/build/outputs/apk/debug/app-debug.apk out/ClipMergeStudio-v2.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMergeStudio-v2.5-APK
          path: out/ClipMergeStudio-v2.5.apk
          if-no-files-found: error
          retention-days: 1
