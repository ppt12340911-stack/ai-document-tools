name: Build 怕嘎球人剪片工坊 v3.9.2 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v3.9.2 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/base.b64
          base64 -d /tmp/base.b64 > /tmp/base.zip
          unzip -t /tmp/base.zip

          rm -rf .chatgpt-build/clipmerge-v37-src
          mkdir -p .chatgpt-build/clipmerge-v37-src
          unzip -q -o /tmp/base.zip -d .chatgpt-build/clipmerge-v37-src

          # v3.9.2 dance screen: routines, mirror mode, per-clip settings and stronger preloading.
          cat .chatgpt-build/clipmerge/v39/dance_part0.txt \
              .chatgpt-build/clipmerge/v39/dance_part1.txt \
              .chatgpt-build/clipmerge/v39/dance_part2.txt > /tmp/dance.b64
          echo "Testing DANCE payload"
          base64 -d /tmp/dance.b64 > /tmp/dance.gz
          gzip -t /tmp/dance.gz
          gzip -dc /tmp/dance.gz > .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

          # Exact v3.7 local editing screen with audio mixing, patched to v3.9.2.
          cat .chatgpt-build/clipmerge/v37/MainActivity.part0.txt \
              .chatgpt-build/clipmerge/v37/MainActivity.part1.txt \
              .chatgpt-build/clipmerge/v37/MainActivity.part2.txt \
              .chatgpt-build/clipmerge/v37/MainActivity.part3.txt > /tmp/main.b64
          echo "Testing MAIN payload"
          base64 -d /tmp/main.b64 > /tmp/main.gz
          gzip -t /tmp/main.gz
          gzip -dc /tmp/main.gz > .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt

          echo "Testing SPLASH payload"
          base64 -d .chatgpt-build/clipmerge/v38b/SplashActivity.txt > /tmp/splash.gz
          gzip -t /tmp/splash.gz
          gzip -dc /tmp/splash.gz > .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/SplashActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.chatgpt-build/clipmerge-v37-src')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          replacement = '''
                  <activity
                      android:name=".DancePracticeActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTop"
                      android:exported="true"
                      android:label="YouTube 練舞"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>'''
          m2, n = re.subn(
              r'\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?(?:</activity>|/>)',
              replacement,
              m,
              count=1,
          )
          if n != 1:
              raise SystemExit('DancePracticeActivity manifest block not found')
          m2 = m2.replace('android:label="ClipMerge 爆笑剪片工坊"', 'android:label="怕嘎球人剪片工坊"')
          manifest.write_text(m2, encoding='utf-8')

          strings = root / 'app/src/main/res/values/strings.xml'
          st = strings.read_text(encoding='utf-8').replace('ClipMerge 爆笑剪片工坊', '怕嘎球人剪片工坊')
          strings.write_text(st, encoding='utf-8')

          main = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          main_text = main.read_text(encoding='utf-8').replace(
              '怕嘎球人剪片工坊  v3.7',
              '怕嘎球人剪片工坊  v3.9.2'
          )
          main.write_text(main_text, encoding='utf-8')

          # v3.9.2: restore the proven-safe YouTube dual-player behavior.
          # Keep the new v3.9 routine/mirror features, but stop aggressively autoplaying
          # the hidden standby player, which can make Android WebView playback unstable.
          dance = root / 'app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt'
          dt = dance.read_text(encoding='utf-8')
          dt = dt.replace('YouTube 練舞剪輯 v3.9', 'YouTube 練舞剪輯 v3.9.2')
          dt = dt.replace(
              "<meta name='viewport' content='width=device-width,initial-scale=1.0'>",
              "<meta name='viewport' content='width=device-width,initial-scale=1.0'><meta name='referrer' content='strict-origin-when-cross-origin'>"
          )
          dt = dt.replace(
              "playerVars:{origin:'https://com.clipmerge.studio',playsinline:1,controls:1,rel:0,fs:1},",
              "playerVars:{origin:'https://com.clipmerge.studio',widget_referrer:'https://com.clipmerge.studio/',playsinline:1,controls:1,rel:0,fs:1,autoplay:0},"
          )
          dt = dt.replace("#playerB{visibility:hidden}", "#playerB{display:none}")
          dt = dt.replace(
              "playerDiv(0).style.visibility=(index===0?'visible':'hidden');\n    playerDiv(1).style.visibility=(index===1?'visible':'hidden');",
              "playerDiv(0).style.display=(index===0?'block':'none');\n    playerDiv(1).style.display=(index===1?'block':'none');"
          )
          dt = re.sub(r"if\(index!==active\)\{[\s\S]*?return;\s*\}", "if(index!==active) return;", dt, count=1)
          dt = re.sub(r"p\.mute\(\);\s*p\.loadVideoById\(\{videoId:id,startSeconds:s\}\);\s*setTimeout\(function\(\)\{try\{p\.setPlaybackRate\(r\);\}catch\(e\)\{\}\},120\);\s*prepared=\{id:id,start:s,rate:r,index:standby,warmed:false\};", "p.cueVideoById({videoId:id,startSeconds:s});\\n      setTimeout(function(){try{p.setPlaybackRate(r);}catch(e){}},150);\\n      prepared={id:id,start:s,rate:r,index:standby,warmed:true};", dt, count=1)
          dt = dt.replace("try{old.pauseVideo();old.mute();}catch(e){}", "try{old.pauseVideo();}catch(e){}")

          # YouTube's current embed rules are stricter about a real Referer/Origin.
          app_page = "https://github.com/ppt12340911-stack/ai-document-tools/"
          dt = dt.replace(
              'loadDataWithBaseURL("https://com.clipmerge.studio/", html, "text/html", "UTF-8", null)',
              f'loadDataWithBaseURL("{app_page}", html, "text/html", "UTF-8", null)'
          )
          dt = dt.replace("origin:'https://com.clipmerge.studio'", "origin:'https://github.com'")
          dt = dt.replace("widget_referrer:'https://com.clipmerge.studio/'", f"widget_referrer:'{app_page}'")
          dt = re.sub(
              r'(domStorageEnabled\s*=\s*true)',
              r'''\1
                webView.settings.userAgentString = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Mobile Safari/537.36"''',
              dt,
              count=1
          )
          dance.write_text(dt, encoding='utf-8')

          splash = root / 'app/src/main/java/com/clipmerge/studio/SplashActivity.kt'
          sp = splash.read_text(encoding='utf-8')
          sp = sp.replace('setPadding(24, 24, 24, 24)', 'setPadding(16, 8, 16, 8)')
          sp = sp.replace(
              'val iconSize = (dm.heightPixels * 0.58f).toInt().coerceAtLeast(360)',
              'val iconSize = (dm.heightPixels * 0.72f).toInt().coerceAtLeast(440)'
          )
          splash.write_text(sp, encoding='utf-8')
          PY

          cat > .chatgpt-build/clipmerge-v37-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v37-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 22
                  versionName = "3.9.1"
              }

              buildFeatures { buildConfig = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v37-src/gradle.properties

          MAIN_SRC=.chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt
          DANCE_SRC=.chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt
          SPLASH_SRC=.chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/SplashActivity.kt
          grep -q '怕嘎球人剪片工坊  v3.9.2' "$MAIN_SRC" || { echo 'CHECK FAIL: main version'; exit 1; }
          grep -q 'GainProcessor' "$MAIN_SRC" || { echo 'CHECK FAIL: audio gain'; exit 1; }
          grep -q 'withAudioFrom' "$MAIN_SRC" || { echo 'CHECK FAIL: audio mix'; exit 1; }
          grep -q 'GradientDrawable' "$SPLASH_SRC" || { echo 'CHECK FAIL: splash'; exit 1; }
          grep -q 'dm.widthPixels \* 0.36f' "$SPLASH_SRC" || { echo 'CHECK FAIL: splash size'; exit 1; }
          grep -q 'YouTube 練舞剪輯 v3.9.2' "$DANCE_SRC" || { echo 'CHECK FAIL: dance version'; exit 1; }
          grep -q 'routines_v2' "$DANCE_SRC" || { echo 'CHECK FAIL: routines'; exit 1; }
          grep -q '鏡像練舞' "$DANCE_SRC" || { echo 'CHECK FAIL: mirror'; exit 1; }
          grep -q 'A -0.1秒' "$DANCE_SRC" || { echo 'CHECK FAIL: fine trim'; exit 1; }
          grep -q 'prepareNext' "$DANCE_SRC" || { echo 'CHECK FAIL: prepareNext'; exit 1; }
          grep -q 'cueVideoById' "$DANCE_SRC" || { echo 'CHECK FAIL: safe cue preload'; grep -n 'prepareNext\|loadVideoById\|cueVideoById' "$DANCE_SRC" | head -30; exit 1; }
          grep -q 'strict-origin-when-cross-origin' "$DANCE_SRC" || { echo 'CHECK FAIL: referrer policy'; exit 1; }
          grep -q 'github.com/ppt12340911-stack/ai-document-tools' "$DANCE_SRC" || { echo 'CHECK FAIL: real base URL'; exit 1; }
          grep -q 'Chrome/121.0.0.0' "$DANCE_SRC" || { echo 'CHECK FAIL: modern UA'; exit 1; }

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v37-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v37-src/app/build/outputs/apk/debug/app-debug.apk "out/怕嘎球人剪片工坊-v3.9.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 怕嘎球人剪片工坊-v3.9.2-APK
          path: out/怕嘎球人剪片工坊-v3.9.2.apk
          if-no-files-found: error
          retention-days: 1
