name: Build 怕嘎球人剪片工坊 v3.8 APK
on:
  push:
    branches: [build-clipmerge-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare v3.8 project
        run: |
          cat .chatgpt-build/clipmerge/v28_final/part00.txt \
              .chatgpt-build/clipmerge/v28_final/part01.txt \
              .chatgpt-build/clipmerge/v28_final/part02.txt \
              .chatgpt-build/clipmerge/v28_final/part03.txt \
              .chatgpt-build/clipmerge/v28_final/part04.txt \
              .chatgpt-build/clipmerge/v28_final/part05.txt \
              .chatgpt-build/clipmerge/v28_final/part06.txt \
              .chatgpt-build/clipmerge/v28_final/part07.txt > /tmp/base.b64
          base64 -d /tmp/base.b64 > /tmp/base.zip
          unzip -t /tmp/base.zip

          rm -rf .chatgpt-build/clipmerge-v37-src
          mkdir -p .chatgpt-build/clipmerge-v37-src
          unzip -q -o /tmp/base.zip -d .chatgpt-build/clipmerge-v37-src

          # Keep the v3.6 dance screen.
          cat .chatgpt-build/clipmerge/v36/dance_part0.txt \
              .chatgpt-build/clipmerge/v36/dance_part1.txt \
              .chatgpt-build/clipmerge/v36/dance_part2.txt \
              .chatgpt-build/clipmerge/v36/dance_part3.txt > /tmp/dance.b64
          echo "Testing DANCE payload"
          base64 -d /tmp/dance.b64 > /tmp/dance.gz
          gzip -t /tmp/dance.gz
          gzip -dc /tmp/dance.gz > .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

          # Exact v3.7 local editing screen with audio mixing, patched to v3.8.
          cat .chatgpt-build/clipmerge/v37/MainActivity.part0.txt \
              .chatgpt-build/clipmerge/v37/MainActivity.part1.txt \
              .chatgpt-build/clipmerge/v37/MainActivity.part2.txt \
              .chatgpt-build/clipmerge/v37/MainActivity.part3.txt > /tmp/main.b64
          echo "Testing MAIN payload"
          base64 -d /tmp/main.b64 > /tmp/main.gz
          gzip -t /tmp/main.gz
          gzip -dc /tmp/main.gz > .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt

          echo "Testing SPLASH payload"
          base64 -d .chatgpt-build/clipmerge/v37/SplashActivity.txt > /tmp/splash.gz
          gzip -t /tmp/splash.gz
          gzip -dc /tmp/splash.gz > .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/SplashActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.chatgpt-build/clipmerge-v37-src')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          m = manifest.read_text(encoding='utf-8')
          replacement = '''
                  <activity
                      android:name=".DancePracticeActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTop"
                      android:exported="true"
                      android:label="YouTube 練舞"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>'''
          m2, n = re.subn(
              r'\s*<activity\s+android:name="\.DancePracticeActivity"[\s\S]*?(?:</activity>|/>)',
              replacement,
              m,
              count=1,
          )
          if n != 1:
              raise SystemExit('DancePracticeActivity manifest block not found')
          m2 = m2.replace('android:label="ClipMerge 爆笑剪片工坊"', 'android:label="怕嘎球人剪片工坊"')
          manifest.write_text(m2, encoding='utf-8')

          strings = root / 'app/src/main/res/values/strings.xml'
          st = strings.read_text(encoding='utf-8').replace('ClipMerge 爆笑剪片工坊', '怕嘎球人剪片工坊')
          strings.write_text(st, encoding='utf-8')

          main = root / 'app/src/main/java/com/clipmerge/studio/MainActivity.kt'
          main_text = main.read_text(encoding='utf-8').replace(
              '怕嘎球人剪片工坊  v3.7',
              '怕嘎球人剪片工坊  v3.8'
          )
          main.write_text(main_text, encoding='utf-8')

          splash = root / 'app/src/main/java/com/clipmerge/studio/SplashActivity.kt'
          sp = splash.read_text(encoding='utf-8')
          sp = sp.replace('setPadding(24, 24, 24, 24)', 'setPadding(16, 8, 16, 8)')
          sp = sp.replace(
              'val iconSize = (dm.heightPixels * 0.58f).toInt().coerceAtLeast(360)',
              'val iconSize = (dm.heightPixels * 0.72f).toInt().coerceAtLeast(440)'
          )
          splash.write_text(sp, encoding='utf-8')
          PY

          cat > .chatgpt-build/clipmerge-v37-src/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > .chatgpt-build/clipmerge-v37-src/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.clipmerge.studio"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.clipmerge.studio"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 18
                  versionName = "3.8"
              }

              buildFeatures { buildConfig = true }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              val media3 = "1.11.0"
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
          }
          EOF

          sed -i '/android.builtInKotlin=/d;/android.newDsl=/d' .chatgpt-build/clipmerge-v37-src/gradle.properties

          grep -q '怕嘎球人剪片工坊  v3.8' .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt
          grep -q 'GainProcessor' .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt
          grep -q 'withAudioFrom' .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/MainActivity.kt
          grep -q 'iconSize = (dm.heightPixels \* 0.58f)' .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/SplashActivity.kt
          grep -q 'YouTube 練舞剪輯 v3.6' .chatgpt-build/clipmerge-v37-src/app/src/main/java/com/clipmerge/studio/DancePracticeActivity.kt

      - name: Build debug APK
        working-directory: .chatgpt-build/clipmerge-v37-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp .chatgpt-build/clipmerge-v37-src/app/build/outputs/apk/debug/app-debug.apk "out/怕嘎球人剪片工坊-v3.8.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 怕嘎球人剪片工坊-v3.8-APK
          path: out/怕嘎球人剪片工坊-v3.8.apk
          if-no-files-found: error
          retention-days: 1
