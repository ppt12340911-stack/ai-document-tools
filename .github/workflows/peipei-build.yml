name: Build Peipei APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'peipei-part-*.b64'
      - '.github/workflows/peipei-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reassemble project
        run: |
          cat peipei-part-00.b64 peipei-part-01.b64 peipei-part-02.b64 > peipei-project.b64
          base64 -d peipei-project.b64 > peipei-project.tar.bz2
          echo "b9c02fa6446c8a062d83e8cecec109c8034be3d48ce75cb7fd76dc4b2a63ea32  peipei-project.tar.bz2" | sha256sum -c -
          mkdir project
          tar -xjf peipei-project.tar.bz2 -C project
          echo "PROJECT_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-37" || test -d "$ANDROID_HOME/platforms/android-37.0"
          ls -1 "$ANDROID_HOME/platforms" | tail -20
          ls -1 "$ANDROID_HOME/build-tools" | tail -20

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" peipei-v3.apk
          sha256sum peipei-v3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: peipei-v3-apk
          path: peipei-v3.apk
          if-no-files-found: error
          retention-days: 7
